# dsh-ios-roothide 运行配置
# 由 /var/jb/usr/libexec/dsh-ios-roothide/web.sh 与 /var/jb/usr/bin/ds 读取

# dsh 安装根目录（里面应有 node、node_modules/@deepseek-ai/dsh、dsh-home）
DSH_ROOT=/var/mobile/dsh/dsh-ios

# dsh 数据目录（含 .launch-token、sessions/）
DSH_HOME=/var/mobile/dsh/dsh-ios/dsh-home

# web 服务端口
DSH_PORT=3081

# node 可执行文件（留空则用 $DSH_ROOT/node，再退回 PATH 里的 node）
DSH_NODE=

# 额外参数（例如 --jitless）
DSH_NODE_ARGS=--jitless
